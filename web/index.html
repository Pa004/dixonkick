<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Probabilidades de partidos de fútbol calculadas con un modelo estadístico Dixon-Coles. 1X2, over/under 2.5 y BTTS. Sin apuestas." />
    <meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14151b" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="FutbolTipster — Probabilidades de fútbol" />
    <meta property="og:description" content="Predicciones 1X2 por modelo estadístico, con bandas de confianza. Sin apuestas." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FutbolTipster — Probabilidades de fútbol</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("futboltipster-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
